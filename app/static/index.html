<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet</title><style>
:root{--bg:#edf2f8;--bg2:#f8f5f1;--panel:rgba(255,255,255,.62);--panel2:rgba(255,255,255,.84);--line:rgba(255,255,255,.84);--tx:#18212b;--mu:#657180;--ok:#16875a;--bad:#ce4050;--warn:#b8780a;--ac:#3869dc;--shadow:0 16px 44px rgba(38,58,91,.14)}
:root[data-theme=dark]{--bg:#0d1119;--bg2:#171422;--panel:rgba(27,34,48,.7);--panel2:rgba(27,34,48,.94);--line:rgba(255,255,255,.14);--tx:#f0f3f7;--mu:#a5afbf;--ok:#49d49a;--bad:#ff7180;--warn:#efbd5b;--ac:#86a7ff;--shadow:0 18px 50px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.5 "Avenir Next","Segoe UI",sans-serif;background:linear-gradient(135deg,var(--bg),var(--bg2));background-attachment:fixed}body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.3;background-image:linear-gradient(rgba(70,100,150,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(70,100,150,.08) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 86%)}
main{max-width:1050px;margin:auto;padding:30px 20px 50px}header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:13px}.mark{width:42px;height:42px;color:var(--ac);filter:drop-shadow(0 4px 8px rgba(56,105,220,.2))}h1{font:700 30px/1.1 Georgia,serif;letter-spacing:.2px;margin:0}.sub{color:var(--mu);font-size:13px}.toolbar{display:flex;align-items:center;gap:8px}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-radius:18px}.button{border:1px solid var(--line);background:var(--panel);color:var(--tx);padding:8px 13px;border-radius:11px;font:inherit;cursor:pointer}.button:hover{border-color:var(--ac);color:var(--ac)}.button:disabled{opacity:.45;cursor:not-allowed}
#banner{margin-bottom:16px}#banner .glass{padding:14px 17px;border-color:var(--warn)}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(315px,1fr));gap:18px}.card{padding:18px;cursor:pointer;outline:0;transition:transform .16s,box-shadow .16s,border-color .16s}.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 20px 48px rgba(38,58,91,.22)}.top{display:flex;align-items:center;gap:12px}.ico{width:38px;height:38px;color:var(--ac);flex:none}.name{font-weight:700;font-size:17px}.pill{margin-left:auto;display:flex;align-items:center;gap:7px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.35px}.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}.on{color:var(--ok)}.on .dot{background:var(--ok);box-shadow:0 0 9px var(--ok)}.off{color:var(--bad)}.off .dot{background:var(--bad)}.mid{color:var(--warn)}.mid .dot{background:var(--warn);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.3}}
.row{display:flex;gap:14px;margin-top:17px}.row>div{flex:1;min-width:0}.k{color:var(--mu);font-size:12px}.v{font-size:17px;font-weight:700;white-space:nowrap}.quick{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.quick button{font-size:13px;padding:5px 10px}.danger:hover{border-color:var(--bad);color:var(--bad)}.good:hover{border-color:var(--ok);color:var(--ok)}.controls{display:flex;gap:8px;align-items:center;margin-bottom:16px}.control{min-height:38px;border:1px solid var(--line);background:var(--panel);color:var(--tx);padding:8px 11px;border-radius:11px;font:inherit}.control.search{flex:1;min-width:180px}.control:focus{outline:2px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:2px}
dialog{width:min(700px,94vw);max-height:92vh;padding:0;border:0;background:transparent;color:var(--tx);overflow:auto}dialog::backdrop{background:rgba(8,13,23,.46);backdrop-filter:blur(8px)}.inside{padding:22px;background:var(--panel2);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow)}.hd{display:flex;align-items:center;gap:12px}h2{font:700 21px/1.2 Georgia,serif;margin:0}h3{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin:21px 0 7px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mu);font-weight:600}.mono{font:12px ui-monospace,monospace}.bad{color:var(--bad)}.spark{width:100%;height:52px;display:block}.spark polyline{fill:none;stroke:var(--ac);stroke-width:1.7}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.btns .push{margin-left:auto}
@media(max-width:600px){main{padding:22px 14px 40px}header{align-items:flex-start;flex-direction:column}.toolbar{width:100%;justify-content:space-between}h1{font-size:27px}.row{gap:8px}.v{font-size:15px}.card{padding:15px}}
</style></head><body><main>
<header><div class="brand"> <svg class="mark" viewBox="0 0 42 42" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="7" width="30" height="11" rx="3"/><rect x="6" y="24" width="30" height="11" rx="3"/><circle cx="12" cy="12.5" r="1.2" fill="currentColor"/><circle cx="12" cy="29.5" r="1.2" fill="currentColor"/></svg><div><h1>Fleet</h1><div class="sub" id="summary">Connecting to AWS...</div></div></div><div class="toolbar"><span class="sub" id="updated"></span><button class="button" onclick="toggleTheme()" title="Toggle theme">Theme</button><button class="button" onclick="load()">Refresh</button></div></header>
<div id="banner"></div><div class="controls"><input id="search" class="control search" type="search" placeholder="Search machines, regions, tags..." oninput="render()"><select id="filter" class="control" onchange="render()"><option value="all">All states</option><option value="up">Online</option><option value="down">Attention</option><option value="stopped">Stopped</option></select></div><div id="grid"></div></main><dialog id="dlg"></dialog>
<script>
let D={machines:[],events:[],error:null,regions:[],polled:0},openId=null,lastLoad=0;
const $=id=>document.getElementById(id),last=a=>a&&a.length?a[a.length-1]:null;
const ICO='<svg class="ico" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="6" width="26" height="10" rx="3"/><rect x="5" y="20" width="26" height="10" rx="3"/><circle cx="10" cy="11" r="1.1" fill="currentColor"/><circle cx="10" cy="25" r="1.1" fill="currentColor"/></svg>';
const rate=b=>b==null?'--':b>3e8?(b/3e8).toFixed(1)+' GB/s':b>1e6?(b/1e6).toFixed(1)+' MB/s':(b/1e3).toFixed(1)+' KB/s';
const uptime=t=>{const s=Date.now()/1e3-t,d=Math.floor(s/86400),h=Math.floor(s%86400/3600);return d?d+'d '+h+'h':h+'h '+Math.floor(s%3600/60)+'m'};
const state=m=>m.state==='running'?['on','ON']:['pending','stopping','shutting-down'].includes(m.state)?['mid',m.state.toUpperCase()]:['off','OFF'];
const reachLabel=m=>m.reach===true?'Reachable':m.reach===false?'Unreachable':'No probe';
function spark(a){if(!a||a.length<2)return'<div class="sub">No metric data</div>';const mx=Math.max(...a,1e-9),mn=Math.min(...a,0),p=a.map((v,i)=>(i/(a.length-1)*300).toFixed(1)+','+(50-(v-mn)/(mx-mn||1)*46).toFixed(1)).join(' ');return`<svg class="spark" viewBox="0 0 300 52" preserveAspectRatio="none"><polyline points="${p}"/></svg>`}
function render(){const all=D.machines,query=($("search").value||'').toLowerCase().trim(),filter=$("filter").value,ms=all.filter(m=>{const hay=JSON.stringify(m).toLowerCase(),matches=!query||hay.includes(query),state=filter==='all'||(filter==='up'&&m.state==='running')||(filter==='down'&&m.state==='running'&&!m.reach)||(filter==='stopped'&&m.state==='stopped');return matches&&state});$("summary").textContent=all.length?`${all.filter(m=>m.state==='running').length} of ${all.length} machines online`:D.polled?'No instances found':'Waiting for first AWS poll';$("updated").textContent=lastLoad?'updated '+Math.round((Date.now()-lastLoad)/1000)+'s ago':'';$("banner").innerHTML=D.error?`<div class="glass"><b>AWS metrics unavailable.</b> <span class="mono">${D.error}</span><div class="sub">EC2 status is still being monitored. Check IAM permissions for CloudWatch.</div></div>`:'';$("grid").innerHTML=ms.length?ms.map(card).join(''):all.length?`<div class="glass" style="padding:20px"><b>No machines match this view.</b><div class="sub">Change the search or state filter.</div></div>`:`<div class="glass" style="padding:20px"><b>${D.error?'No data yet.':D.polled?'No instances found.':'Waiting for the first AWS poll...'}</b><div class="sub">${D.polled&&!D.error?'Checked '+(D.regions||[]).join(', ')+'.':'This can take up to 30 seconds.'}</div></div>`;if(openId&&$("dlg").open)detail(openId)}
function card(m){const[c,l]=state(m),s=m.series||{},run=m.state==='running';return`<div class="card glass" tabindex="0" role="button" onclick="show('${m.id}')" onkeydown="if(event.key==='Enter')show('${m.id}')"><div class="top">${ICO}<div><div class="name">${m.name}</div><div class="sub">${m.region} · ${m.type}</div><div class="sub">Power: ${l} · Network: ${reachLabel(m)}</div></div><div class="pill ${c}"><span class="dot"></span>${l}</div></div><div class="row"><div><div class="k">CPU</div><div class="v">${last(s.cpu)==null?'--':last(s.cpu).toFixed(0)+'%'}</div></div><div><div class="k">IPv4</div><div class="v">${(m.ipv4_public||m.ipv4_private||[]).length}</div></div><div><div class="k">IPv6</div><div class="v">${(m.ipv6||[]).length}</div></div><div><div class="k">Uptime</div><div class="v">${run?uptime(m.launched):'--'}</div></div></div><div class="quick">${run?`<button class="button danger" onclick="event.stopPropagation();act('${m.region}','${m.id}','reboot')">Restart</button><button class="button danger" onclick="event.stopPropagation();act('${m.region}','${m.id}','stop')">Off</button>`:`<button class="button good" onclick="event.stopPropagation();act('${m.region}','${m.id}','start')">Start</button>`}</div></div>`}
function detail(id){const m=D.machines.find(x=>x.id===id);if(!m)return;const[c,l]=state(m),s=m.series||{},ev=D.events.filter(e=>e.id===id).slice(0,8),tags=Object.entries(m.tags||{}).map(([k,v])=>`${k}=${v}`).join(' · ')||'none';$("dlg").innerHTML=`<div class="inside"><div class="hd">${ICO}<div><h2>${m.name}</h2><div class="sub mono">${m.id} · ${m.az} · ${m.type}</div></div><div class="pill ${c}" style="margin-left:auto"><span class="dot"></span>${l}</div></div><h3>Instance</h3><table><tr><th>Platform</th><td>${m.platform||'--'}</td><th>Architecture</th><td>${m.architecture||'--'}</td></tr><tr><th>Monitoring</th><td>${m.monitoring||'--'}</td><th>Tags</th><td class="mono">${tags}</td></tr><tr><th>Private IP</th><td class="mono">${m.private||'--'}</td><th>Public IP</th><td class="mono">${m.public||'--'}</td></tr></table><h3>Interfaces</h3><table><tr><th>eth</th><th>Private</th><th>Public / IPv6</th><th>MAC</th></tr>${m.ifs.map(n=>`<tr><td>${n.idx}</td><td class="mono">${n.private.join('<br>')}</td><td class="mono">${n.public.concat(n.ipv6).join('<br>')||'--'}</td><td class="mono">${n.mac}</td></tr>`).join('')}</table><h3>CPU · last 3h</h3>${spark(s.cpu)}<h3>Network in · now ${rate(last(s.nin))}</h3>${spark(s.nin)}<h3>Network out · now ${rate(last(s.nout))}</h3>${spark(s.nout)}<h3>Checks</h3><div class="sub">EC2 status: ${last(s.chk)===0?'passing':last(s.chk)==null?'--':'<span class="bad">failing</span>'} · TCP: ${m.reach==null?'not configured':m.reach?'ok':'<span class="bad">failed</span>'} · Restarts: ${m.restarts.join(', ')||'none'}</div><h3>Recent events</h3>${ev.length?'<table>'+ev.map(e=>`<tr><td>${new Date(e.t*1e3).toLocaleString()}</td><td>${e.kind}</td><td class="${e.note==='UNEXPECTED'?'bad':''}">${e.note}</td></tr>`).join('')+'</table>':'<div class="sub">Nothing yet.</div>'}<div class="btns"><button class="button good" onclick="act('${m.region}','${m.id}','start')">Start</button><button class="button danger" onclick="act('${m.region}','${m.id}','reboot')">Restart</button><button class="button danger" onclick="act('${m.region}','${m.id}','stop')">Shut down</button><button class="button" onclick="testAlert()">Test alert</button><button class="button push" onclick="dlg.close()">Close</button></div></div>`}
function show(id){openId=id;detail(id);$("dlg").showModal()}function act(r,id,a){if(!confirm(a+' this machine?'))return;fetch(`/api/machines/${r}/${id}/${a}`,{method:'POST'}).then(()=>setTimeout(load,2000))}function testAlert(){fetch('/api/test-alert',{method:'POST'}).then(()=>alert('Test alert sent'))}function toggleTheme(){const root=document.documentElement,theme=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=theme;localStorage.setItem('fleet-theme',theme)}
function load(){fetch('/api/machines').then(r=>r.json()).then(j=>{D=j;lastLoad=Date.now();render()}).catch(e=>{D.error=e.message;render()})}const saved=localStorage.getItem('fleet-theme');if(saved)document.documentElement.dataset.theme=saved;load();setInterval(load,15000);setInterval(render,1000);
</script></body></html>
